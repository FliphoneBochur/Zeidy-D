name: Extract PDF Text and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  extract-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract PDF text
        run: |
          echo "🔍 Starting PDF text extraction..."
          
          # Create extracted-text directory
          mkdir -p extracted-text
          
          # Function to process a single PDF
          extract_pdf() {
            local pdf_file="$1"
            local relative_path="${pdf_file#Files/}"
            local txt_file="extracted-text/${relative_path%.pdf}.txt"
            local txt_dir=$(dirname "$txt_file")
            
            # Create directory structure
            mkdir -p "$txt_dir"
            
            # Extract text using pdftotext
            if pdftotext "$pdf_file" "$txt_file" 2>/dev/null; then
              echo "✅ Extracted: $pdf_file → $txt_file"
            else
              echo "❌ Failed to extract: $pdf_file"
              # Create empty file so structure is maintained
              touch "$txt_file"
            fi
          }
          
          # Export function for use in find
          export -f extract_pdf
          
          # Find all PDF files and extract text
          find Files -name "*.pdf" -type f | while read pdf_file; do
            extract_pdf "$pdf_file"
          done
          
          # Count results
          pdf_count=$(find Files -name "*.pdf" -type f | wc -l)
          txt_count=$(find extracted-text -name "*.txt" -type f | wc -l)
          
          echo "📊 Summary:"
          echo "   PDFs found: $pdf_count"
          echo "   Text files created: $txt_count"
          
          # List some examples
          echo "📄 Sample extracted files:"
          find extracted-text -name "*.txt" -type f | head -5

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
